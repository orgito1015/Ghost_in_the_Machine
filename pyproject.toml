[project]
name = "ghost-in-the-machine"
version = "2.0.0-dev"
description = "Stateful business-logic fuzzer for authorized security engagements"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "jsonpath-ng>=1.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
record = [
    "mitmproxy>=10.0",
]

[project.scripts]
ghost = "ghost.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghost*"]
